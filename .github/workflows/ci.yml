name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv venv --python 3.12 .venv

      - name: Install
        run: |
          . .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Ruff
        run: |
          . .venv/bin/activate
          ruff check src tests scripts

      - name: Mypy
        run: |
          . .venv/bin/activate
          mypy src/coderag

      # No Postgres service needed: tests use `pgserver`, which bundles
      # PostgreSQL + pgvector and runs rootless.
      - name: Pytest
        run: |
          . .venv/bin/activate
          pytest --cov=coderag --cov-report=term-missing
