[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI ("pipx install coderag-ai"); the import name and the CLI
# command are both `coderag`. Plain "coderag" is taken on PyPI by an unrelated project,
# and "code-rag" is rejected as too similar (PyPI collapses -/_/. when comparing names).
name = "coderag-ai"
version = "0.10.0"
description = "Token-efficient, structure-aware Code Intelligence + RAG for private source repositories."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "CodeRAG contributors" }]
keywords = [
    "rag", "code-intelligence", "retrieval", "pgvector", "llm", "mcp",
    "claude", "code-search", "tree-sitter", "token-optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]


# Base install: retrieval platform works WITHOUT an LLM and WITHOUT heavy ML deps.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",        # LGPL-3.0 — see docs/licenses.md
    "pgvector>=0.3.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Local embeddings (no source code leaves infra). Heavy: pulls torch.
embeddings = ["sentence-transformers>=3.0"]
# More accurate token counting (needs network on first use to fetch BPE ranks).
tokens = ["tiktoken>=0.7"]
# Prometheus metrics endpoint.
metrics = ["prometheus-client>=0.20"]
# Static-analysis adapters (Phase 10).
analyzers = ["pylint>=3.2", "flake8>=7.1"]
# MCP server: lets Claude Code (and other MCP clients) call CodeRAG retrieval.
mcp = ["mcp>=2.0"]
# Rootless local PostgreSQL+pgvector — no Docker, Homebrew, or sudo required.
# pgserver only ships wheels for CPython 3.9–3.12, so the marker keeps the extra
# installable on newer interpreters (the `coderag localdb` command then explains
# what to do instead of the install failing outright).
localdb = ["pgserver>=0.1.4; python_version < '3.13'", "alembic>=1.13"]
# Development / testing.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pgserver>=0.1.4",             # bundles PostgreSQL + pgvector for rootless tests
    "types-requests",
]

[project.scripts]
coderag = "coderag.cli.main:app"
coderag-mcp = "coderag.mcp_server:main"

[project.urls]
Homepage = "https://github.com/galacticsurfer/coderag"
Repository = "https://github.com/galacticsurfer/coderag"
Documentation = "https://github.com/galacticsurfer/coderag/tree/main/docs"
Issues = "https://github.com/galacticsurfer/coderag/issues"
Changelog = "https://github.com/galacticsurfer/coderag/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/coderag"]

# Keep the sdist to actual project sources. Without an explicit include, the
# extension's node_modules (25MB, 5k files) gets swept in.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/docker",
    "/scripts",
    "/alembic.ini",
    "/Dockerfile",
    "/docker-compose.yml",
    "/Makefile",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/.env.example",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Alembic version files are autogenerated; don't lint their formatting.
extend-exclude = ["src/coderag/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# dashboard.py is a self-contained HTML/JS template string.
"src/coderag/api/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["coderag"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: tests that require a PostgreSQL (pgserver) instance",
    "slow: slow tests (e.g. real embedding model download)",
]

[tool.coverage.run]
source = ["coderag"]
