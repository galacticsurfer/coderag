# One-shot: `docker compose up` (or `make up`) boots PostgreSQL+pgvector AND the
# CodeRAG API — migrations run automatically, and the bundled demo repo is indexed
# on first boot so http://localhost:8000/dashboard has data immediately.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coderag
      POSTGRES_PASSWORD: coderag
      POSTGRES_DB: coderag
    ports:
      - "5432:5432"
    volumes:
      - coderag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderag -d coderag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CODERAG_DATABASE_URL: postgresql+psycopg://coderag:coderag@db:5432/coderag
      CODERAG_EMBEDDING_PROVIDER: ${CODERAG_EMBEDDING_PROVIDER:-hashing}
      # Index the bundled demo on first boot so the dashboard isn't empty. Set to 0 to skip.
      CODERAG_INDEX_DEMO: ${CODERAG_INDEX_DEMO:-1}
      # Optional — only needed for `ask` (the LLM step). search/context/dashboard need no key.
      CODERAG_LLM_PROVIDER: ${CODERAG_LLM_PROVIDER:-anthropic}
      CODERAG_ANTHROPIC_API_KEY: ${CODERAG_ANTHROPIC_API_KEY:-}
      CODERAG_ANTHROPIC_MODEL: ${CODERAG_ANTHROPIC_MODEL:-claude-sonnet-5}
    ports:
      - "8000:8000"
    volumes:
      # Mount a repo to index from inside the container:
      #   docker compose exec api coderag index /workspace --name myrepo
      - ${CODERAG_REPO_PATH:-./examples/demo-repository}:/workspace:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  coderag_pgdata:
